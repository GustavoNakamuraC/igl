spring:
  application:
    name: igl-backend
  config:
    # Lê backend/.env.local (formato KEY=valor) se existir. Variáveis de ambiente têm prioridade.
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/igl}
    username: ${DB_USERNAME:igl}
    password: ${DB_PASSWORD:igl}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      # O front comprime as imagens (WebP) antes de enviar; 2 MB é folga.
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
